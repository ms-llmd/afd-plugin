# Governing (identity) Service for every StatefulSet of one deployment.
#
# Headless with publishNotReadyAddresses: true, selecting this deployment's
# pods by the afd-deployment label: StatefulSets require a serviceName whose
# selector covers their pods, but recipes never use pod DNS (rendezvous
# goes through the named ffn-p2p Service), so one Service per deployment
# satisfies all of its StatefulSets at once.
# Must exist before any StatefulSet is applied (step 4d, like every other
# Service -- see services.md).
apiVersion: v1
kind: Service
metadata:
  name: ${TEMPLATE_DEPLOY_NAME}-recipe-sts
  labels:
    app: afd-recipe
    afd-deployment: ${TEMPLATE_DEPLOY_NAME}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: afd-recipe
    afd-deployment: ${TEMPLATE_DEPLOY_NAME}
