# Same as pod.yaml plus RoCE: the multi-nic network attachment and the shared
# GPUDirect-RDMA device resource, so /dev/infiniband is present and NCCL can
# report GIN.
apiVersion: v1
kind: Pod
metadata:
  name: deepep-m2n-spike-rdma
  labels:
    app: deepep-m2n-spike
  annotations:
    k8s.v1.cni.cncf.io/networks: multi-nic-compute
spec:
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              # Free H100 nodes on 2026-10-14; b93r43s3 already caches the image.
              - key: kubernetes.io/hostname
                operator: In
                values: ["pokprod-b93r43s3", "pokprod-b93r43s2", "pokprod-b93r43s1"]
  containers:
    - name: spike
      image: ghcr.io/ronenkat/afd-plugin-e2e:e2e-f82ab8a
      command: ["bash", "-c", "sleep 86400"]
      env:
        - name: HOME
          value: /work
        - name: EP_JIT_CACHE_DIR
          value: /work/ep_jit
        - name: AFD_DEEPEP_BUILD_DIR
          value: /work/deepep_build
        - name: AFD_DEEPEP_PER_BUFFER_COMM_STREAM
          value: "1"
        - name: PYTHONPATH
          value: /work/spike
      resources:
        requests:
          nvidia.com/gpu: 4
          rdma/roce_gdr: 1
          cpu: "16"
          memory: 128Gi
        limits:
          nvidia.com/gpu: 4
          rdma/roce_gdr: 1
          cpu: "16"
          memory: 128Gi
      volumeMounts:
        - name: work
          mountPath: /work
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: work
      emptyDir: {}
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 32Gi
